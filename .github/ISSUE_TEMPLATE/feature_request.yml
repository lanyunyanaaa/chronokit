name: Feature request
description: Suggest an idea for ChronoKit.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what stands in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should ChronoKit do? Sketch the workflow if you can.
    validations:
      required: true
  - type: checkboxes
    id: roadmap
    attributes:
      label: Roadmap
      description: |
        Check [docs/ROADMAP.md](https://github.com/lanyunyanaaa/chronokit/blob/main/docs/ROADMAP.md)
        to see whether this is already planned.
      options:
        - label: I checked the roadmap and this is not already on it
