name: Bug report
description: Something went wrong — tell us what happened.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ChronoKit version
      placeholder: e.g. 0.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 10 22H2 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add files …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: File formats involved, screenshots, journal excerpt (it contains local file paths) — anything that helps.
