appId: com.chronokit.app
productName: ChronoKit
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
win:
  target:
    - target: nsis
    - target: portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
