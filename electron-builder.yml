appId: com.chronokit.app
productName: ChronoKit
directories:
  buildResources: build
  output: release/${version}
# reuse the dev-installed Electron binaries instead of downloading a zip
electronDist: node_modules/electron/dist
beforePack: scripts/verify-pack.cjs
files:
  - out/**
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'
win:
  icon: build/icon.ico
  target:
    - target: nsis
    - target: portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
